{% extends 'base.html' %}

{% block content %}
<h2>{{ title }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit" class="btn-submit">Save</button>
        <a href="{% url 'notes:course_list' %}" class="btn-discard">Discard</a>
    </div>
</form>
{% endblock %}
