{% extends 'base.html' %}

{% block content %}
<div class="confirm-delete">
    <h2>Are you sure you want to delete the note "{{ note.title }}" from the course "{{ course.title }}"?</h2>
    <p>This action cannot be undone!</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Delete</button>
        <a href="{% url 'notes:note_list' course.id %}" class="btn-cancel">Discard</a>
    </form>
</div>
{% endblock %}
